<svg width="1200" height="472" viewBox="0 0 1200 472" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Deneyim zaman çizelgesi">
  <defs>
    <pattern id="ddots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.6" fill="#151d2a"/>
    </pattern>
    <clipPath id="dcard"><rect width="1200" height="472" rx="16"/></clipPath>
    <linearGradient id="spine" gradientUnits="userSpaceOnUse" x1="186" y1="46" x2="186" y2="430">
      <stop offset="0%" stop-color="#FFB000"/>
      <stop offset="18%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#243447"/>
    </linearGradient>
    <filter id="nowglow" x="-300%" y="-300%" width="700%" height="700%">
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#FFB000" flood-opacity="0.9"/>
    </filter>
  </defs>
  <style>
    .sans{font-family:'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif}
    .mono{font-family:'Cascadia Code','JetBrains Mono','Fira Code',Consolas,monospace}
    .rol{font-size:16.5px;font-weight:600;fill:#EDF2F7}
    .sirket{font-size:16.5px;fill:#00E5FF}
    .det{font-size:12.8px;fill:#7d8da1}
    .yil{font-size:13px;fill:#8b98a8;letter-spacing:.5px}
    .now{animation:np 2.4s ease-in-out infinite}
    @keyframes np{0%,100%{opacity:1}50%{opacity:.4}}
    @media (prefers-reduced-motion:reduce){.now{animation:none}}
  </style>

  <g clip-path="url(#dcard)">
    <rect width="1200" height="472" fill="#0d1117"/>
    <rect width="1200" height="472" fill="url(#ddots)"/>
    <path d="M186,46 V430" stroke="url(#spine)" stroke-width="2.5"/>

    <!-- 2025 -->
    <text x="150" y="62" text-anchor="end" class="mono yil" fill="#FFB000">2025</text>
    <circle cx="186" cy="57" r="7" fill="#0d1117" stroke="#FFB000" stroke-width="3"/>
    <circle cx="186" cy="57" r="3" fill="#FFB000" class="now" filter="url(#nowglow)"/>
    <text x="216" y="53" class="sans rol">Robotik Sistemler Elektronik Takım Lideri<tspan class="sirket">  ·  Assuva Uzay ve Havacılık Sanayi</tspan></text>
    <rect x="216" y="64" width="62" height="19" rx="9.5" fill="#231a06" stroke="#FFB000" stroke-width="1.2"/>
    <text x="247" y="77.5" text-anchor="middle" class="mono" font-size="10.5" letter-spacing="1" fill="#FFB000">ŞU AN</text>
    <text x="290" y="78" class="mono det">robotik kol ve robotik köpek · PCB tasarımı · sensör entegrasyonu · teknik liderlik</text>

    <!-- 2023 -->
    <text x="150" y="135" text-anchor="end" class="mono yil">2023</text>
    <circle cx="186" cy="130" r="6" fill="#0d1117" stroke="#00E5FF" stroke-width="2.5"/>
    <text x="216" y="126" class="sans rol">Yaz Stajı — Gömülü Sistemler / Donanım Tasarım Müh.<tspan class="sirket">  ·  Utenos Kolegija, Litvanya</tspan></text>
    <text x="216" y="149" class="mono det">otonom hidroponik tarım · gömülü otomasyon · 2 uluslararası akademik makale</text>

    <!-- 2022 -->
    <text x="150" y="207" text-anchor="end" class="mono yil">2022</text>
    <circle cx="186" cy="202" r="6" fill="#0d1117" stroke="#00E5FF" stroke-width="2.5"/>
    <text x="216" y="198" class="sans rol">Yaz Stajı — Gömülü Sistemler<tspan class="sirket">  ·  YONGATEK Microelectronics</tspan></text>
    <text x="216" y="221" class="mono det">savunma sanayi projesi devre tasarımı · UPBoard üzerinde I2C sensör optimizasyonu</text>

    <!-- 2020-2023 -->
    <text x="150" y="279" text-anchor="end" class="mono yil">2020–2023</text>
    <circle cx="186" cy="274" r="6" fill="#0d1117" stroke="#00E5FF" stroke-width="2.5"/>
    <text x="216" y="270" class="sans rol">Gömülü Sistem Geliştirme Mühendisi<tspan class="sirket">  ·  Konya Bilim Merkezi</tspan></text>
    <text x="216" y="293" class="mono det">Raspberry Pi · PIC · Jetson Nano · Arduino — robotik projeler ve sergi düzenekleri</text>

    <!-- 2020-2021 -->
    <text x="150" y="351" text-anchor="end" class="mono yil">2020–2021</text>
    <circle cx="186" cy="346" r="6" fill="#0d1117" stroke="#3b4f66" stroke-width="2.5"/>
    <text x="216" y="342" class="sans rol">Yazar ve Editör<tspan class="sirket">  ·  Mert Mekatronik</tspan></text>
    <text x="216" y="365" class="mono det">teknik makaleler · editörlük · sosyal medya koordinatörlüğü</text>

    <!-- 2019-2020 -->
    <text x="150" y="423" text-anchor="end" class="mono yil">2019–2020</text>
    <circle cx="186" cy="418" r="6" fill="#0d1117" stroke="#3b4f66" stroke-width="2.5"/>
    <text x="216" y="414" class="sans rol">Asistan Öğrenci<tspan class="sirket">  ·  KTO Karatay Üniversitesi</tspan></text>
    <text x="216" y="437" class="mono det">Elektrik-Elektronik Mühendisliği Bölüm Başkanı öğrenci asistanlığı</text>
  </g>
  <rect x="1" y="1" width="1198" height="470" rx="16" fill="none" stroke="#1e2836" stroke-width="2"/>
</svg>
