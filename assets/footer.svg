<svg width="1200" height="150" viewBox="0 0 1200 150" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Seri port: while (çalışıyor) { /* dokunma */ } — sonsuz döngü, bilerek bırakıldı">
  <defs>
    <pattern id="fdots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.6" fill="#151d2a"/>
    </pattern>
    <clipPath id="fcard"><rect x="0" y="0" width="1200" height="150" rx="16"/></clipPath>
    <filter id="ledglow" x="-300%" y="-300%" width="700%" height="700%">
      <feDropShadow dx="0" dy="0" stdDeviation="2.6" flood-color="#3FB950" flood-opacity="0.9"/>
    </filter>
  </defs>
  <style>
    .mono{font-family:'Cascadia Code','JetBrains Mono','Fira Code',Consolas,monospace}
    .caret{animation:blink 1.06s steps(2,start) infinite}
    @keyframes blink{50%{opacity:0}}
    .led{animation:pulse 2.4s ease-in-out infinite}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
    @media (prefers-reduced-motion:reduce){.caret,.led{animation:none}}
  </style>

  <g clip-path="url(#fcard)">
    <rect width="1200" height="150" fill="#0d1117"/>
    <rect width="1200" height="150" fill="url(#fdots)"/>

    <!-- başlık çubuğu: seri port -->
    <rect width="1200" height="38" fill="#10161f"/>
    <path d="M0,38 H1200" stroke="#1e2836" stroke-width="2"/>
    <rect x="24" y="15" width="9" height="9" rx="2" fill="#2c4158"/>
    <rect x="39" y="15" width="9" height="9" rx="2" fill="#2c4158"/>
    <rect x="54" y="15" width="9" height="9" rx="2" fill="#2c4158"/>
    <text x="80" y="25" class="mono" font-size="13" fill="#56728f">/dev/ttyUSB0 · 115200 8N1</text>
    <circle cx="1104" cy="19" r="4" fill="#3FB950" class="led" filter="url(#ledglow)"/>
    <text x="1176" y="25" text-anchor="end" class="mono" font-size="13" letter-spacing="1" fill="#3FB950">BAĞLI</text>

    <!-- gövde -->
    <text x="600" y="92" text-anchor="middle" class="mono" font-size="24"><tspan fill="#56728f">$ </tspan><tspan fill="#FF7B72">while</tspan><tspan fill="#c9d1d9"> (</tspan><tspan fill="#79C0FF">çalışıyor</tspan><tspan fill="#c9d1d9">) { </tspan><tspan fill="#6E7681">/* dokunma */</tspan><tspan fill="#c9d1d9"> }</tspan><tspan fill="#FFB000" class="caret">▮</tspan></text>

    <text x="600" y="122" text-anchor="middle" class="mono" font-size="14" fill="#6E7681">// çıkış koşulu yok · bilerek bırakıldı</text>
  </g>
  <rect x="1" y="1" width="1198" height="148" rx="16" fill="none" stroke="#1e2836" stroke-width="2"/>
</svg>
