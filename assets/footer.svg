<svg width="1200" height="120" viewBox="0 0 1200 120" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Devre çalışıyorsa dokunma.">
  <defs>
    <pattern id="fdots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.6" fill="#151d2a"/>
    </pattern>
    <clipPath id="fcard"><rect x="0" y="0" width="1200" height="120" rx="16"/></clipPath>
  </defs>
  <style>
    .mono{font-family:'Cascadia Code','JetBrains Mono','Fira Code',Consolas,monospace}
    .wire{fill:none;stroke:#1d2b3d;stroke-width:2}
    .sig{fill:none;stroke:#00E5FF;stroke-width:2;stroke-linecap:round;stroke-dasharray:16 298;animation:flow 5s linear infinite}
    .sigA{stroke:#FFB000;animation-duration:7s}
    @keyframes flow{from{stroke-dashoffset:628}to{stroke-dashoffset:0}}
    .blink{animation:blink 1.1s steps(2,start) infinite}
    @keyframes blink{50%{opacity:0}}
  </style>
  <g clip-path="url(#fcard)">
    <rect width="1200" height="120" fill="#0d1117"/>
    <rect width="1200" height="120" fill="url(#fdots)"/>

    <path class="wire" d="M0,56 H400"/>
    <path class="sig" d="M0,56 H400"/>
    <circle cx="400" cy="56" r="3.5" fill="#24384f"/>

    <path class="wire" d="M1200,56 H800"/>
    <path class="sig sigA" d="M1200,56 H800"/>
    <circle cx="800" cy="56" r="3.5" fill="#24384f"/>

    <text x="600" y="62" text-anchor="middle" class="mono" font-size="19" fill="#00E5FF">&gt; devre çalışıyorsa dokunma.<tspan class="blink" fill="#FFB000">▮</tspan></text>

    <path d="M600,72 V86" stroke="#3b4f66" stroke-width="2"/>
    <path d="M584,86 H616" stroke="#3b4f66" stroke-width="2"/>
    <path d="M590,92 H610" stroke="#3b4f66" stroke-width="2"/>
    <path d="M596,98 H604" stroke="#3b4f66" stroke-width="2"/>
  </g>
  <rect x="1" y="1" width="1198" height="118" rx="16" fill="none" stroke="#1e2836" stroke-width="2"/>
</svg>
