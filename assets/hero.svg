<svg width="1200" height="300" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Emre Özkul — Elektrik-Elektronik Mühendisi · Robotik ve Gömülü Sistemler">
  <defs>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.6" fill="#151d2a"/>
    </pattern>
    <clipPath id="card"><rect x="0" y="0" width="1200" height="300" rx="18"/></clipPath>
    <clipPath id="scope"><rect x="872" y="212" width="256" height="56" rx="8"/></clipPath>
    <filter id="glowA" x="-80%" y="-80%" width="260%" height="260%">
      <feDropShadow dx="0" dy="0" stdDeviation="3.2" flood-color="#FFB000" flood-opacity="0.85"/>
    </filter>
  </defs>
  <style>
    .sans{font-family:'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif}
    .mono{font-family:'Cascadia Code','JetBrains Mono','Fira Code',Consolas,monospace}
    .wire{fill:none;stroke:#1d2b3d;stroke-width:2}
    .sig{fill:none;stroke:#00E5FF;stroke-width:2;stroke-linecap:round;stroke-dasharray:16 298;animation:flow 4.6s linear infinite}
    .sigA{stroke:#FFB000;animation-duration:6.4s}
    .sigF{animation-duration:3.2s}
    @keyframes flow{from{stroke-dashoffset:628}to{stroke-dashoffset:0}}
    .blink{animation:blink 1.8s steps(2,start) infinite}
    @keyframes blink{50%{opacity:0.12}}
    .scroll{animation:scroll 4s linear infinite}
    @keyframes scroll{from{transform:translateX(0)}to{transform:translateX(-256px)}}
    @media (prefers-reduced-motion:reduce){.sig,.blink,.scroll{animation:none}}
  </style>

  <g clip-path="url(#card)">
    <rect width="1200" height="300" fill="#0d1117"/>
    <rect width="1200" height="300" fill="url(#dots)"/>

    <!-- PCB hatları -->
    <path class="wire" d="M0,40 H210 L240,70 H320"/>
    <path class="sig sigF" d="M0,40 H210 L240,70 H320"/>
    <circle cx="320" cy="70" r="3.5" fill="#24384f"/>

    <path class="wire" d="M1200,44 H1030 L1000,74"/>
    <path class="sig" d="M1200,44 H1030 L1000,74"/>

    <path class="wire" d="M918,104 H812 L780,136 H640"/>
    <path class="sig sigA" d="M918,104 H812 L780,136 H640"/>
    <circle cx="640" cy="136" r="3.5" fill="#24384f"/>

    <path class="wire" d="M998,190 V212"/>

    <!-- MCU -->
    <g>
      <rect x="902" y="76" width="16" height="7" rx="2" fill="#2c4158"/>
      <rect x="902" y="100" width="16" height="7" rx="2" fill="#2c4158"/>
      <rect x="902" y="124" width="16" height="7" rx="2" fill="#2c4158"/>
      <rect x="902" y="148" width="16" height="7" rx="2" fill="#2c4158"/>
      <rect x="902" y="172" width="16" height="7" rx="2" fill="#2c4158"/>
      <rect x="1078" y="76" width="16" height="7" rx="2" fill="#2c4158"/>
      <rect x="1078" y="100" width="16" height="7" rx="2" fill="#2c4158"/>
      <rect x="1078" y="124" width="16" height="7" rx="2" fill="#2c4158"/>
      <rect x="1078" y="148" width="16" height="7" rx="2" fill="#2c4158"/>
      <rect x="1078" y="172" width="16" height="7" rx="2" fill="#2c4158"/>
      <rect x="940" y="48" width="7" height="16" rx="2" fill="#2c4158"/>
      <rect x="968" y="48" width="7" height="16" rx="2" fill="#2c4158"/>
      <rect x="996" y="48" width="7" height="16" rx="2" fill="#2c4158"/>
      <rect x="1024" y="48" width="7" height="16" rx="2" fill="#2c4158"/>
      <rect x="1052" y="48" width="7" height="16" rx="2" fill="#2c4158"/>
      <rect x="940" y="190" width="7" height="16" rx="2" fill="#2c4158"/>
      <rect x="968" y="190" width="7" height="16" rx="2" fill="#2c4158"/>
      <rect x="996" y="190" width="7" height="16" rx="2" fill="#2c4158"/>
      <rect x="1024" y="190" width="7" height="16" rx="2" fill="#2c4158"/>
      <rect x="1052" y="190" width="7" height="16" rx="2" fill="#2c4158"/>
      <rect x="918" y="64" width="160" height="126" rx="10" fill="#10161f" stroke="#2c4158" stroke-width="2"/>
      <circle cx="936" cy="82" r="4" fill="#FFB000"/>
      <text x="998" y="128" text-anchor="middle" class="mono" font-size="26" font-weight="700" fill="#00E5FF">EÖ-32</text>
      <text x="998" y="152" text-anchor="middle" class="mono" font-size="11" letter-spacing="2" fill="#56728f">EMBEDDED CORE</text>
    </g>
    <circle cx="1120" cy="80" r="5" fill="#FFB000" class="blink" filter="url(#glowA)"/>
    <text x="1120" y="100" text-anchor="middle" class="mono" font-size="9" letter-spacing="1" fill="#56728f">STAT</text>

    <!-- osiloskop -->
    <rect x="872" y="212" width="256" height="56" rx="8" fill="#0a0f16" stroke="#1d2b3d" stroke-width="2"/>
    <g stroke="#131c29" stroke-width="1">
      <path d="M904,212 V268"/><path d="M936,212 V268"/><path d="M968,212 V268"/><path d="M1000,212 V268"/>
      <path d="M1032,212 V268"/><path d="M1064,212 V268"/><path d="M1096,212 V268"/><path d="M872,240 H1128"/>
    </g>
    <g clip-path="url(#scope)">
      <g class="scroll">
        <path id="wf" d="M872,240 h20 v-14 h18 v28 h18 v-14 h22 l12,-20 l12,40 l12,-20 h20 q12,-22 24,0 q12,22 24,0 h18 v-12 h18 v24 h18 v-12 h20" fill="none" stroke="#00E5FF" stroke-width="2" stroke-linejoin="round"/>
        <use href="#wf" x="256"/>
      </g>
    </g>
    <text x="884" y="227" class="mono" font-size="10" fill="#FFB000">CH1</text>
    <text x="1116" y="227" text-anchor="end" class="mono" font-size="10" fill="#3b4f66">2ms/div</text>

    <!-- köşe etiketleri -->
    <text x="1176" y="30" text-anchor="end" class="mono" font-size="12" fill="#56728f">PWR <tspan class="blink" fill="#00E5FF">●</tspan> 3V3</text>
    <text x="28" y="286" class="mono" font-size="12" fill="#3b4f66">// konseptten prototipe</text>
    <text x="1172" y="286" text-anchor="end" class="mono" font-size="12" fill="#3b4f66">github.com/EmreOzkull</text>

    <!-- metin bloğu -->
    <text x="90" y="98" class="mono" font-size="15" fill="#56728f">// elektrik-elektronik mühendisi</text>
    <text x="88" y="154" class="sans" font-size="56" font-weight="700" fill="#f0f6fc">Emre Özkul</text>
    <text x="90" y="196" class="mono" font-size="20" fill="#00E5FF">Robotik Sistemler Elektronik Takım Lideri · Assuva</text>

    <!-- rozet çipleri -->
    <g class="mono" font-size="13" letter-spacing="1">
      <rect x="88" y="224" width="110" height="32" rx="16" fill="#0f1722" stroke="#FFB000" stroke-width="1.5"/>
      <text x="143" y="245" text-anchor="middle" fill="#FFB000">ROBOTİK</text>
      <rect x="212" y="224" width="196" height="32" rx="16" fill="#0f1722" stroke="#00E5FF" stroke-width="1.5"/>
      <text x="310" y="245" text-anchor="middle" fill="#00E5FF">GÖMÜLÜ SİSTEMLER</text>
      <rect x="422" y="224" width="152" height="32" rx="16" fill="#0f1722" stroke="#3b4f66" stroke-width="1.5"/>
      <text x="498" y="245" text-anchor="middle" fill="#9fb3c8">PCB TASARIMI</text>
    </g>
  </g>
  <rect x="1" y="1" width="1198" height="298" rx="18" fill="none" stroke="#1e2836" stroke-width="2"/>
</svg>
